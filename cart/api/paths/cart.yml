parameters:
  - $ref: '../components/parameters.yml#/UserID'
get:
  operationId: getCart
  description: Get user cart
  responses:
    '200':
      description: User cart
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/GetCartResponse'
    '400':
      $ref: '../components/errors.yml#/BadRequest'
    '404':
      description: Cart does not exist or is empty
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/Error'
    '412':
      description: Product does not exist
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/Error'
    default:
      $ref: '../components/errors.yml#/UnexpectedError'
